[package]
name = "collector"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
time = { version = "0.3", features = ["parsing", "macros"] }

[dev-dependencies]
tempfile = "3"
