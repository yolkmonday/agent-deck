[package]
name = "agent-deck"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
collector = { path = "crates/collector" }
dirs = "5"
portable-pty = "0.9"
anyhow = "1"
jsonc-parser = { version = "0.26", features = ["cst", "serde"] }
time = { version = "0.3", features = ["parsing", "formatting", "local-offset"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"

[dev-dependencies]
tempfile = "3"
rusqlite = "0.32"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
members = [".", "crates/collector"]
